<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>

    <style>
        th, td{border: 1px solid black}

        thead {
            background-color: aqua;
        }

        tfoot {
            background-color: cyan;
        }
    
    
    
    </style>




</head>
<body>
    <h1>Tabelas</h1>
    
    <table>

         <thead>
            <tr>
                <th>Produto</th>
                <th>Quantidade</th>
                <th>Preço</th>
                <th>Black Friday</th>
            </tr>
         </thead>
        
         <tbody>
            <tr>
                <td>Produto 4</td>
                <td>2</td>
                <td>10$</td>
                <td>Sim</td>
            </tr>
            <tr>
                <td>Produto 5</td>
                <td>5</td>
                <td>50$</td>
                <td>Sim</td>
            </tr>
            <tr>
                <td>Produto 6</td>
                <td>3</td>
                <td>100$</td>
                <td>Não</td>
            </tr>
        
         </tbody>

         <tfoot>
            <tr>
                <td colspan="2">Total</td>
                <td>160$</td>
            </tr>
         </tfoot>

    </table>
</body>
</html>
